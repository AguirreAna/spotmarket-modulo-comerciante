<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/LogoNavbar.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpotMarket — Módulo Comerciante & Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&family=Lobster&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('theme') || localStorage.getItem('tema');
          if (t === 'claro') {
            document.documentElement.classList.add('tema-claro');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.remove('tema-claro');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
